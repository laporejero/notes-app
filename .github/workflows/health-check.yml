name: Periodic health check

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  health_check:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployed Notes App
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://notes-app-srlh.onrender.com/health
          follow-redirect: false
          max-attempts: 3
          retry-delay: 5s